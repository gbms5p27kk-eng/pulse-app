name: Deploy Pulse notifications to Cloudflare

# Manual deployment only. The Worker is not ready to send push notifications.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required Cloudflare configuration
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAMESPACE: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          for name in ACCOUNT TOKEN NAMESPACE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Cloudflare secret: $name"
              exit 1
            fi
          done
      - name: Write Wrangler deployment configuration
        env:
          NAMESPACE: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          cat > wrangler.toml <<EOF
          name = "pulse-notifications"
          main = "cloudflare/pulse-notifications-worker.js"
          compatibility_date = "2026-11-02"

          [[kv_namespaces]]
          binding = "PULSE_REMINDERS"
          id = "$NAMESPACE"
          EOF
      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
